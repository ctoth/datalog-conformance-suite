- name: antoniou_ambiguous_attacker_blocks_only_in_propagating
  description: >
    Reduced from Antoniou 2007 section 3.5's ambiguity-blocking versus ambiguity-propagating
    example on p.10. The original uses pacifist(a) as the ambiguous literal and hasGun(a) as the
    downstream conclusion. This retained zero-arity form keeps the same structure: the attacker to p
    depends on a, and a is itself ambiguous. Blocking leaves p defeasibly provable because the
    attacker body is not defeasibly established. Propagating leaves both sides undecided because
    merely supported ambiguity is enough to overrule.
  tags: [root-conflict, policy-difference]
  theory:
    facts: {}
    strict_rules: []
    defeasible_rules:
      - id: r1
        head: "p"
        body: []
      - id: r2
        head: "a"
        body: []
      - id: r3
        head: "~a"
        body: []
      - id: r4
        head: "~p"
        body: ["a"]
    defeaters: []
    superiority: []
  expect_per_policy:
    blocking:
      defeasibly:
        p: [[]]
      undecided:
        a: [[]]
        "~a": [[]]
        "~p": [[]]
    propagating:
      undecided:
        p: [[]]
        "~p": [[]]
        a: [[]]
        "~a": [[]]
- name: antoniou_ambiguity_propagates_to_downstream_rule
  description: >
    Reduced from the same Antoniou 2007 section 3.5 example on p.10. Once the root conclusion p
    becomes undecided under propagating semantics, the downstream conclusion q also becomes
    undecided. Under blocking semantics p survives, so q is defeasibly provable.
  tags: [downstream-propagation, policy-difference]
  theory:
    facts: {}
    strict_rules: []
    defeasible_rules:
      - id: r1
        head: "p"
        body: []
      - id: r2
        head: "a"
        body: []
      - id: r3
        head: "~a"
        body: []
      - id: r4
        head: "~p"
        body: ["a"]
      - id: r5
        head: "q"
        body: ["p"]
    defeaters: []
    superiority: []
  expect_per_policy:
    blocking:
      defeasibly:
        p: [[]]
        q: [[]]
      undecided:
        a: [[]]
        "~a": [[]]
        "~p": [[]]
    propagating:
      undecided:
        p: [[]]
        "~p": [[]]
        a: [[]]
        "~a": [[]]
        q: [[]]
