source: spindle-racket/tests/query/integration-test.rkt
tags:
- defeasible
- spindle-racket
tests:
- name: spindle_racket_query_bird_flies
  description: A bird fact supports the default that birds fly.
  source: "spindle-racket/tests/query/integration-test.rkt::E2E-1: Create theory with facts -> run reasoning -> query literal -> success"
  tags:
  - basic
  - facts
  - defeasible
  theory:
    facts:
      bird:
      - []
    strict_rules: []
    defeasible_rules:
    - id: r1
      head: flies
      body:
      - bird
    defeaters: []
    superiority: []
  expect:
    definitely:
      bird:
      - []
    defeasibly:
      flies:
      - []
- name: spindle_racket_query_penguin_superiority
  description: A penguin exception defeats the generic bird-flight rule.
  source: "spindle-racket/tests/query/integration-test.rkt::E2E-4: Conflict resolution with superiority"
  tags:
  - basic
  - superiority
  - exceptions
  theory:
    facts:
      bird:
      - []
      penguin:
      - []
    strict_rules: []
    defeasible_rules:
    - id: r1
      head: flies
      body:
      - bird
    - id: r2
      head: ~flies
      body:
      - penguin
    defeaters: []
    superiority:
    - - r2
      - r1
  expect:
    definitely:
      bird:
      - []
      penguin:
      - []
    defeasibly:
      ~flies:
      - []
    not_defeasibly:
      flies:
      - []
- name: spindle_racket_query_chain_derivation
  description: Defeasible forward chaining derives all downstream literals.
  source: "spindle-racket/tests/query/integration-test.rkt::E2E-5: Chain derivation through multiple rules"
  tags:
  - basic
  - chaining
  theory:
    facts:
      a:
      - []
    strict_rules: []
    defeasible_rules:
    - id: r1
      head: b
      body:
      - a
    - id: r2
      head: c
      body:
      - b
    - id: r3
      head: d
      body:
      - c
    defeaters: []
    superiority: []
  expect:
    definitely:
      a:
      - []
    defeasibly:
      b:
      - []
      c:
      - []
      d:
      - []
- name: spindle_racket_query_defeater_blocks_conclusion
  description: A defeater blocks q without proving ~q.
  source: "spindle-racket/tests/query/integration-test.rkt::E2E-6: Defeater blocks conclusion"
  tags:
  - basic
  - defeater
  theory:
    facts:
      bird:
      - []
      broken_wing:
      - []
    strict_rules: []
    defeasible_rules:
    - id: r1
      head: flies
      body:
      - bird
    defeaters:
    - id: d1
      head: ~flies
      body:
      - broken_wing
    superiority: []
  expect:
    definitely:
      bird:
      - []
      broken_wing:
      - []
    not_defeasibly:
      flies:
      - []
      ~flies:
      - []
- name: spindle_racket_query_strict_conclusion
  description: A strict rule derives mortal definitely.
  source: "spindle-racket/tests/query/integration-test.rkt::E2E-7: Strict rule derivation is definite"
  tags:
  - basic
  - strict
  theory:
    facts:
      human:
      - []
    strict_rules:
    - id: r1
      head: mortal
      body:
      - human
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely:
      human:
      - []
      mortal:
      - []
- name: spindle_racket_query_missing_premise_failure
  description: A missing tests_pass premise leaves ready_review unprovable.
  source: "spindle-racket/tests/query/integration-test.rkt::WI-1: Query fails without required premise"
  tags:
  - basic
  - chaining
  - missing-premise
  theory:
    facts:
      code_complete:
      - []
    strict_rules: []
    defeasible_rules:
    - id: r1
      head: ready_review
      body:
      - tests_pass
      - code_complete
    defeaters: []
    superiority: []
  expect:
    definitely:
      code_complete:
      - []
    not_defeasibly:
      ready_review:
      - []
- name: spindle_racket_query_nested_chain
