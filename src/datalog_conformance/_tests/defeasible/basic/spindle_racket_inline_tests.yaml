source: spindle-racket/tests/spindle-tests.rkt
tags:
- defeasible
- spindle-racket
tests:
- name: spindle_racket_fact_vs_strict_rule_conflict
  description: A fact and a conflicting strict-rule conclusion are both definitely
    provable.
  source: spindle-racket/tests/spindle-tests.rkt::Fact conflicting with strict rule
    conclusion
  tags:
  - basic
  - inconsistency
  - strict
  theory:
    facts:
      p:
      - []
      q:
      - []
    strict_rules:
    - id: r1
      head: ~p
      body:
      - q
    defeasible_rules: []
    defeaters: []
    superiority: []
    conflicts:
    - - p
      - ~p
  expect:
    definitely:
      p:
      - []
      q:
      - []
      ~p:
      - []
- name: spindle_racket_multiple_antecedents
  description: A defeasible rule fires when all three antecedents are present.
  source: spindle-racket/tests/spindle-tests.rkt::Rule with multiple antecedents
  tags:
  - basic
  - chaining
  theory:
    facts:
      p:
      - []
      q:
      - []
      r:
      - []
    strict_rules: []
    defeasible_rules:
    - id: r1
      head: s
      body:
      - p
      - q
      - r
    defeaters: []
    superiority: []
  expect:
    definitely:
      p:
      - []
      q:
      - []
      r:
      - []
    defeasibly:
      s:
      - []
- name: spindle_racket_mixed_strict_defeasible_conflict
  description: A strict rule for c blocks a competing defeasible rule for ~c.
  source: spindle-racket/tests/spindle-tests.rkt::Interaction between strict and defeasible
    rules
  tags:
  - basic
  - strict
  - conflicts
  theory:
    facts:
      a:
      - []
      b:
      - []
    strict_rules:
    - id: r1
      head: c
      body:
      - a
    defeasible_rules:
    - id: r2
      head: ~c
      body:
      - b
    defeaters: []
    superiority: []
    conflicts:
    - - c
      - ~c
  expect:
    definitely:
      a:
      - []
      b:
      - []
      c:
      - []
    not_defeasibly:
      ~c:
      - []
- name: spindle_racket_defeater_negative_conclusions
  description: A defeater blocks q and still does not prove ~q.
  source: spindle-racket/tests/spindle-tests.rkt::Defeater produces non-provability
    conclusions
  tags:
  - basic
  - defeater
  theory:
    facts:
      p:
      - []
    strict_rules: []
    defeasible_rules:
    - id: r1
      head: q
      body:
      - p
    defeaters:
    - id: r2
      head: ~q
      body:
      - p
    superiority: []
    conflicts:
    - - q
      - ~q
  expect:
    definitely:
      p:
      - []
    not_defeasibly:
      q:
      - []
      ~q:
      - []
- name: spindle_racket_simple_fact
  description: A simple fact is definitely provable.
  source: spindle-racket/tests/spindle-tests.rkt::Simple fact should be definitely
    provable
  tags:
  - basic
  - facts
  theory:
    facts:
      p:
      - []
    strict_rules: []
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely:
      p:
      - []
- name: spindle_racket_negated_fact
  description: A negated fact is definitely provable.
  source: spindle-racket/tests/spindle-tests.rkt::Negated fact should be definitely
    provable
  tags:
  - basic
  - facts
  - negation
  theory:
    facts:
      ~q:
      - []
    strict_rules: []
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely:
