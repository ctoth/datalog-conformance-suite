source: spindle-racket/src/test-theories
tags:
- defeasible
- spindle-racket
tests:
- name: spindle_racket_penguin_exception
  description: Penguin non-flight defeats generic bird flight.
  source: spindle-racket/src/test-theories/penguin.dfl
  tags:
  - basic
  - superiority
  - exceptions
  theory:
    facts:
      tweety:
      - []
      penguin:
      - []
    strict_rules: []
    defeasible_rules:
    - id: r1
      head: bird
      body:
      - tweety
    - id: r2
      head: flies
      body:
      - bird
    - id: r3
      head: bird
      body:
      - penguin
    - id: r4
      head: ~flies
      body:
      - penguin
    defeaters: []
    superiority:
    - - r4
      - r2
  expect:
    definitely:
      tweety:
      - []
      penguin:
      - []
    defeasibly:
      bird:
      - []
      ~flies:
      - []
    not_defeasibly:
      flies:
      - []
