- name: spindle_racket_medical_treatment
  description: A contraindication defeats the first treatment and enables the fallback.
  source: spindle-racket/tests/medical-treatment.dfl
  tags:
  - basic
  - superiority
  - safety
  theory:
    facts:
      hasConditionX:
      - []
      allergicToA:
      - []
    strict_rules: []
    defeasible_rules:
    - id: r1
      head: recommendTreatmentA
      body:
      - hasConditionX
    - id: r2
      head: ~recommendTreatmentA
      body:
      - allergicToA
    - id: r3
      head: recommendTreatmentB
      body:
      - hasConditionX
      - ~recommendTreatmentA
    defeaters: []
    superiority:
    - - r2
      - r1
  expect:
    definitely:
      hasConditionX:
      - []
      allergicToA:
