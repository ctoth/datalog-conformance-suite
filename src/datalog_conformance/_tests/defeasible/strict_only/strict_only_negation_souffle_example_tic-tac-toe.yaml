      body:
      - all_states(a1,b1,c1,a2,b2,c2,a3,b3,c3,_)
    - id: r8
      head: dig2( a1,b1,c1,a2,b2,c2,a3,b3,c3, c1,b2,a3 )
      body:
      - all_states(a1,b1,c1,a2,b2,c2,a3,b3,c3,_)
    - id: r9
      head: has_won( a1,b1,c1,a2,b2,c2,a3,b3,c3, x )
      body:
      - row2( a1,b1,c1,a2,b2,c2,a3,b3,c3, x,x,x )
    - id: r10
      head: has_won( a1,b1,c1,a2,b2,c2,a3,b3,c3, x )
      body:
