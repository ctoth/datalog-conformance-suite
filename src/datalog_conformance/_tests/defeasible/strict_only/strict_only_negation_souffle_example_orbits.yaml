- souffle
tests:
- name: strict_only_souffle_orbits_star
  description: Strict-only defeasible form of souffle_orbits_star.
  source: souffle/example/orbits
  tags:
  - defeasible
  - example
  - negation
  - souffle
  - strict-only
  theory:
    facts:
      orbits: &id002
      - - earth
        - sun
      - - moon
        - earth
    strict_rules:
    - id: r1
      head: orbits(X,Y)
      body:
      - orbits(X,Z)
      - orbits(Z,Y)
    - id: r2
      head: satellite(X,Y)
      body:
      - orbits(X,Y)
      - not intermediate(X,Y)
      - not star(Y)
    - id: r3
      head: planet(X)
      body:
      - orbits(X,Y)
      - star(Y)
      - not intermediate(X,Y)
    - id: r4
      head: intermediate(X,Y)
      body:
      - orbits(X,Z)
      - orbits(Z,Y)
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely: &id001
      star:
      - - sun
    defeasibly: *id001
