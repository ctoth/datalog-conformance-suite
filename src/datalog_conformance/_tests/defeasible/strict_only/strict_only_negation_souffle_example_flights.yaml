- example
- souffle
tests:
- name: strict_only_souffle_flights_QAflies
  description: Strict-only defeasible form of souffle_flights_QAflies.
  source: souffle/example/flights
  tags:
  - defeasible
  - example
  - recursion
  - souffle
  - strict-only
  theory:
    facts:
      flight: &id002
      - - QA
        - AU
        - CHI
      - - QA
        - AU
        - JPN
      - - QA
        - JPN
        - DEN
      - - QA
        - JPN
        - CHI
      - - QA
        - AU
        - CHI
      - - VA
        - AU
        - CHI
      - - VA
        - JPN
        - ZA
      - - VA
        - JPN
        - DEN
      - - VA
        - DEN
        - ZA
    strict_rules:
    - id: r1
      head: QAflies(X,Y)
      body:
      - flight("QA",X,Z)
      - QAflies(Z,Y)
    - id: r2
      head: VAflies(X,Y)
      body:
      - flight("VA",X,Y)
    - id: r3
      head: VAflies(X,Y)
      body:
      - flight("VA",X,Z)
      - VAflies(Z,Y)
    - id: r4
      head: QAonly(X,Y)
      body:
      - QAflies(X,Y)
      - not VAflies(X,Y)
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely: &id001
      QAflies:
      - - AU
        - CHI
      - - AU
        - JPN
      - - JPN
        - DEN
      - - JPN
        - CHI
      - - AU
        - DEN
    defeasibly: *id001
