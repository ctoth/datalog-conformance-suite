tests:
- name: strict_only_souffle_list_checker
  description: Strict-only defeasible form of souffle_list_checker.
  source: souffle/evaluation/list
  tags:
  - basic
  - defeasible
  - evaluation
  - souffle
  - strict-only
  theory:
    facts:
      list:
      - - y
        - 0
      - - z
        - 0
      - - a
        - 1
      succ:
      - - x
        - y
      - - y
        - z
      - - z
        - a
    strict_rules:
    - id: r1
      head: check(a, "0")
      body:
      - list(a, "0")
      - succ(a, s)
      - check(s, "0")
    - id: r2
      head: check(a, "0")
      body:
      - list(a, "0")
      - succ(a, s)
      - check(s, "1")
    - id: r3
      head: check(a, "1")
      body:
      - list(a, "1")
    - id: r4
      head: checker(a)
      body:
      - check(a, "0")
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely: &id001
      checker:
      - - x
      - - y
      - - z
    defeasibly: *id001
