tests:
- name: strict_only_souffle_game2_canMove
  description: Strict-only defeasible form of souffle_game2_canMove.
  source: souffle/example/game2
  tags:
  - defeasible
  - example
  - negation
  - souffle
  - strict-only
  theory:
    facts:
      move: &id002
      - - 2
        - 3
      - - 3
        - 4
      - - 1
        - 3
      - - 1
        - 5
    strict_rules:
    - id: r1
      head: canMove(X)
      body:
      - move(X,_)
    - id: r2
      head: possible_winning(X)
      body:
      - odd_move(X,Y)
      - not canMove(Y)
    - id: r3
      head: winning(X)
      body:
      - move(X,Y)
      - not possible_winning(Y)
    - id: r4
      head: odd_move(X,Y)
      body:
      - move(X,Y)
    - id: r5
      head: odd_move(X,Y)
      body:
      - move(X,Z1)
      - move(Z1,Z2)
      - odd_move(Z2,Y)
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely: &id001
      canMove:
      - - 1
      - - 2
      - - 3
    defeasibly: *id001
