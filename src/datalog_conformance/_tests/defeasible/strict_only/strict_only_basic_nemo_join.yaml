        - Z
        - Z
      - - F
        - E
        - D
      - - D
        - B
        - Q
      - - D
        - B
        - Z
      - - D
        - B
        - F
    strict_rules:
    - id: r1
      head: J1(X, Y, Z)
      body:
      - sourceA(X, Z, Y)
      - sourceB(X, Y, T)
    - id: r2
      head: J2(X, Y, Z)
      body:
      - sourceA(Z, Y, X)
      - sourceC(X, Y, T)
    - id: r3
      head: J3(X, Y, W)
      body:
      - sourceA(T, Y, X)
      - sourceB(T, Y, X)
      - sourceC(X, Y, W)
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely: &id001
      J1:
      - - A
        - C
        - B
      - - B
        - D
        - B
      - - C
        - D
        - D
    defeasibly: *id001
