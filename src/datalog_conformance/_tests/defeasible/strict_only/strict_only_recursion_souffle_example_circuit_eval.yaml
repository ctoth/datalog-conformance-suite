source: derived/strict-only/recursion/souffle_example_circuit_eval.yaml
tags:
- defeasible
- strict-only
- example
- souffle
tests:
- name: strict_only_souffle_circuit_eval_g_assignment
  description: Strict-only defeasible form of souffle_circuit_eval_g_assignment.
  source: souffle/example/circuit_eval
  tags:
  - defeasible
  - example
  - recursion
  - souffle
  - strict-only
  theory:
    facts:
      g_or: &id002
      - - x
        - r
        - s
      g_and: &id003
      - - s
        - c
        - d
      - - r
        - a
        - b
      - - t
        - d
        - e
      g_not: &id004
      - - y
        - t
      set_input: &id005
      - - a
        - 'true'
      - - b
        - 'false'
      - - c
        - 'true'
      - - d
        - 'true'
      - - e
        - 'false'
    strict_rules:
    - id: r1
      head: g_assignment(x, "false")
      body:
      - set_input(x, "false"); g_and(x, o1, _)
      - g_assignment(o1, "false"); g_and(x, _, o2)
      - g_assignment(o2, "false"); g_or(x, o1, o2)
      - g_assignment(o1, "false")
      - g_assignment(o2, "false")
      - g_not(x, o1)
      - g_assignment(o1, "true")
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely: &id001
      g_assignment:
      - - c
        - 'true'
      - - d
        - 'true'
      - - a
        - 'true'
      - - b
        - 'false'
      - - e
        - 'false'
      - - s
        - 'true'
      - - r
        - 'false'
      - - t
        - 'false'
      - - x
        - 'true'
      - - y
        - 'true'
    defeasibly: *id001
- name: strict_only_souffle_circuit_eval_yield_outs
  description: Strict-only defeasible form of souffle_circuit_eval_yield_outs.
  source: souffle/example/circuit_eval
  tags:
  - basic
  - defeasible
  - example
  - souffle
  - strict-only
  theory:
    facts:
      g_or: *id002
      g_and: *id003
      g_not: *id004
      set_input: *id005
    strict_rules:
    - id: r1
      head: g_assignment(x, "false")
      body:
      - set_input(x, "false"); g_and(x, o1, _)
      - g_assignment(o1, "false"); g_and(x, _, o2)
      - g_assignment(o2, "false"); g_or(x, o1, o2)
      - g_assignment(o1, "false")
      - g_assignment(o2, "false")
      - g_not(x, o1)
      - g_assignment(o1, "true")
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely: &id006
      yield_outs:
      - - s
        - 'true'
      - - r
        - 'false'
      - - t
        - 'false'
      - - x
        - 'true'
      - - y
        - 'true'
    defeasibly: *id006
