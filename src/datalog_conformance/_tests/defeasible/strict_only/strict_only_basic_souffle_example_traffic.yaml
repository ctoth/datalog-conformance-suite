source: derived/strict-only/basic/souffle_example_traffic.yaml
tags:
- defeasible
- strict-only
- example
- souffle
tests:
- name: strict_only_souffle_traffic_crashable
  description: Strict-only defeasible form of souffle_traffic_crashable.
  source: souffle/example/traffic
  tags:
  - basic
  - defeasible
  - example
  - souffle
  - strict-only
  theory:
    facts:
      greenSignal: &id002
      - - Abercrombie St
      - - Cleveland St
      - - Shepard St
      - - Elizabeth St
      - - Goulburn St
      hasTraffic: &id003
      - - Abercrombie St
      - - Lawson St
      - - Elizabeth St
      - - Goulburn St
      intersect: &id004
      - - Abercrombie St
        - Lawson St
      - - Cleveland St
        - Shepard St
      - - Elizabeth St
        - Goulburn St
    strict_rules:
    - id: r1
      head: crashes(X)
      body:
      - hasTraffic(X)
      - crashable(X, Y)
      - hasTraffic(Y)
    - id: r2
      head: crashes(X)
      body:
      - hasTraffic(X)
      - crashable(Y, X)
      - hasTraffic(Y)
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely: &id001
      crashable:
      - - Cleveland St
        - Shepard St
      - - Elizabeth St
        - Goulburn St
    defeasibly: *id001
- name: strict_only_souffle_traffic_crashes
  description: Strict-only defeasible form of souffle_traffic_crashes.
  source: souffle/example/traffic
  tags:
  - basic
  - defeasible
  - example
  - souffle
  - strict-only
  theory:
    facts:
      greenSignal: *id002
      hasTraffic: *id003
      intersect: *id004
    strict_rules:
    - id: r1
      head: crashes(X)
      body:
      - hasTraffic(X)
      - crashable(X, Y)
      - hasTraffic(Y)
    - id: r2
      head: crashes(X)
      body:
      - hasTraffic(X)
      - crashable(Y, X)
      - hasTraffic(Y)
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely: &id005
      crashes:
      - - Elizabeth St
      - - Goulburn St
    defeasibly: *id005
