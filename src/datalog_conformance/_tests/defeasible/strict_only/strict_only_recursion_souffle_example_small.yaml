      mother: &id002
      - - claudette
        - ann
      - - jeannette
        - bill
      - - mireille
        - john
      father: &id003
      - - john
        - ann
      - - john
        - bill
      - - jean-jacques
        - alphonse
      - - alphonse
        - mireille
      - - brad
        - john
    strict_rules:
    - id: r1
      head: parent(X,Y)
      body:
      - father(X,Y)
    - id: r2
      head: ancestor(X,Y)
      body:
      - parent(X,Y)
    - id: r3
      head: ancestor(X,Y)
      body:
      - parent(X,Z)
      - ancestor(Z,Y)
    defeasible_rules: []
    defeaters: []
    superiority: []
  expect:
    definitely: &id001
      mother:
      - - claudette
        - ann
      - - jeannette
        - bill
      - - mireille
        - john
    defeasibly: *id001
