source: souffle/example/func
tags:
- example
- souffle
tests:
- name: souffle_func_eq
  description: Harvested from Souffle testcase func, asserting exported relation eq.
  tags:
  - basic
  - example
  - souffle
  program:
    facts:
      succ:
      - - 2
        - 3
      - - 3
        - 4
      f:
      - - x
        - g
      - - y
        - f
      arg:
      - - x
        - 1
        - A
      - - x
        - 2
        - B
      - - x
        - 3
        - Z
      - - y
        - 1
        - C
      - - y
        - 2
        - D
      - - y
        - 3
        - W
    rules:
    - eq(a, b) :- f(v, a), f(w, b), args(v, w, "3").
    - args(v, w, i) :- succ(p, i), arg(v, i, k), arg(w, i, k), args(v, w, p).
    - args(v, w, "1") :- arg(v, "1", _), arg(w, "1", _).
  expect:
    eq:
    - - g
      - g
    - - f
      - f
