source: souffle/example/traffic
tags:
- example
- souffle
tests:
- name: souffle_traffic_crashable
  description: Harvested from Souffle testcase traffic, asserting exported relation
    crashable.
  tags:
  - basic
  - example
  - souffle
  program:
    facts: &id001
      greenSignal:
      - - Abercrombie St
      - - Cleveland St
      - - Shepard St
      - - Elizabeth St
      - - Goulburn St
      hasTraffic:
      - - Abercrombie St
      - - Lawson St
      - - Elizabeth St
      - - Goulburn St
      intersect:
      - - Abercrombie St
        - Lawson St
      - - Cleveland St
        - Shepard St
      - - Elizabeth St
        - Goulburn St
    rules: &id002
    - crashes(X) :- hasTraffic(X), crashable(X, Y), hasTraffic(Y).
    - crashes(X) :- hasTraffic(X), crashable(Y, X), hasTraffic(Y).
  expect:
    crashable:
    - - Cleveland St
      - Shepard St
    - - Elizabeth St
      - Goulburn St
- name: souffle_traffic_crashes
  description: Harvested from Souffle testcase traffic, asserting exported relation
    crashes.
  tags:
  - basic
  - example
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    crashes:
    - - Elizabeth St
    - - Goulburn St
