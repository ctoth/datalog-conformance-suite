source: souffle/evaluation/list
tags:
- evaluation
- souffle
tests:
- name: souffle_list_checker
  description: Harvested from Souffle testcase list, asserting exported relation checker.
  tags:
  - basic
  - evaluation
  - souffle
  program:
    facts:
      list:
      - - y
        - 0
      - - z
        - 0
      - - a
        - 1
      succ:
      - - x
        - y
      - - y
        - z
      - - z
        - a
    rules:
    - check(a, "0") :- list(a, "0"), succ(a, s), check(s, "0").
    - check(a, "0") :- list(a, "0"), succ(a, s), check(s, "1").
    - check(a, "1") :- list(a, "1").
    - checker(a) :- check(a, "0").
  expect:
    checker:
    - - x
    - - y
    - - z
