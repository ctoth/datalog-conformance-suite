source: souffle/evaluation/relop
tags:
- evaluation
- souffle
tests:
- name: souffle_relop_a
  description: Harvested from Souffle testcase relop, asserting exported relation
    a.
  tags:
  - basic
  - evaluation
  - souffle
  program:
    facts: &id001
      a:
      - - a2
      - - a3
      b:
      - - b1
      - - b2
      - - a1
      c:
      - - a1
        - b2
      - - a1
        - a1
      - - a2
        - b2
    rules: &id002
    - projection(X) :- c(X,_).
    - cartesian(X,Y) :- a(X), b(Y).
    - inner_join(X) :- a(X), b(X).
  expect:
    a:
    - - a1
    - - a2
    - - a3
