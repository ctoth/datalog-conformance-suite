source: souffle/example/metro
tags:
- example
- souffle
tests:
- name: souffle_metro_platform2_reach
  description: Harvested from Souffle testcase metro, asserting exported relation
    platform2_reach.
  tags:
  - basic
  - example
  - souffle
  program:
    facts:
      link:
      - - 4
        - platform1
        - platform2
      - - 4
        - platform2
        - platform3
      - - 4
        - platform3
        - platform4
      - - 1
        - platform4
        - platform5
      - - 1
        - platform5
        - platform6
      - - 1
        - platform7
        - platform8
      - - 9
        - platform8
        - platform9
      - - 9
        - platform9
        - platform10
    rules:
    - St_Reachable(x, y) :- St_Reachable(x, z), link(_, z, y).
    - Li_Reachable(x, u) :- St_Reachable(x, z), link(u, z, _).
    - platform2_reach("platform2", y) :- St_Reachable("platform2", y), link(_, _,
      y).
  expect:
    platform2_reach:
    - - platform2
      - platform3
    - - platform2
      - platform4
    - - platform2
      - platform5
    - - platform2
      - platform6
