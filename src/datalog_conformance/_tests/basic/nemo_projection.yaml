tests:
- name: nemo_projection_A
  description: Harvested from Nemo testcase projection, asserting exported relation
    A.
  tags:
  - basic
  - projection
  - nemo
  - a
  program:
    facts: &id001
      data:
      - - A
        - B
        - C
      - - B
        - B
        - D
      - - A
        - E
        - F
      - - C
        - D
        - D
    rules: &id002
    - A(X, Z) :- data(X, Y, Z).
    - B(Y, X) :- A(X, Y).
    - C(Y) :- B(VariableThatIsNotNeeded, Y).
    - D(Y, Z) :- data(X, Y, Z).
    - E(F, E) :- D(E, F).
  expect:
    A:
    - - A
      - C
    - - A
      - F
    - - B
      - D
    - - C
      - D
