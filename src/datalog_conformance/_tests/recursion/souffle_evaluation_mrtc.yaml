source: souffle/evaluation/mrtc
tags:
- evaluation
- souffle
tests:
- name: souffle_mrtc_p
  description: Harvested from Souffle testcase mrtc, asserting exported relation p.
  tags:
  - basic
  - evaluation
  - souffle
  program:
    facts: &id001
      p:
      - - c
        - d
      q:
      - - b
        - c
      - - d
        - e
      p1:
      - - a1
        - b1
      - - c1
        - d1
      q1:
      - - b1
        - c1
      - - d1
        - e1
    rules: &id002
    - pqs(X,Y) :- p(X,Y).
    - pqs(X,Y) :- q(X,Y).
    - pqs(X,Y) :- pqs(X,Z),p(Z,Y).
    - pqs(X,Y) :- pqs(X,Z),q(Z,Y).
    - pqs(X,Y) :- pqs1(X,Y).
    - pqs1(X,Y) :- p1(X,Y).
    - pqs1(X,Y) :- q1(X,Y).
    - pqs1(X,Y) :- pqs1(X,Z),p1(Z,Y).
    - pqs1(X,Y) :- pqs1(X,Z),q1(Z,Y).
  expect:
    p:
    - - a
      - b
    - - c
      - d
