source: souffle/example/dfa_live_vars
tags:
- example
- souffle
tests:
- name: souffle_dfa_live_vars_live_vars_in
  description: Harvested from Souffle testcase dfa_live_vars, asserting exported relation
    live_vars_in.
  tags:
  - example
  - recursion
  - souffle
  program:
    facts: &id001
      cf_edge:
      - - B
        - C
      - - C
        - C
      - - C
        - D
      - - B
        - D
      - - D
        - E
      def:
      - - A
        - x1
      - - B
        - x2
      - - C
        - x2
      - - D
        - x3
      use:
      - - B
        - x1
      - - C
        - x2
      - - D
        - x2
      - - E
        - x2
      - - E
        - x3
    rules: &id002
    - live_vars_in(x,v) :- use(x,v).
    - live_vars_in(x,v) :- not def(x,v), live_vars_out(x,v).
    - live_vars_out(x,v) :- cf_edge(x,y), live_vars_in(y,v).
  expect:
    live_vars_in:
    - - B
      - x1
    - - C
      - x2
    - - D
      - x2
    - - E
      - x2
    - - E
      - x3
- name: souffle_dfa_live_vars_live_vars_out
  description: Harvested from Souffle testcase dfa_live_vars, asserting exported relation
    live_vars_out.
  tags:
  - example
  - recursion
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    live_vars_out:
    - - A
      - x1
    - - B
      - x2
    - - C
      - x2
    - - D
      - x2
    - - D
      - x3
