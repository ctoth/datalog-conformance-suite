source: souffle/example/andersen
tags:
- example
- souffle
tests:
- name: souffle_andersen_PointsTo
  description: Harvested from Souffle testcase andersen, asserting exported relation
    PointsTo.
  tags:
  - example
  - recursion
  - souffle
  program:
    facts:
      Assign:
      - - f
        - a
      Load:
      - - a
        - b
      AddressOf:
      - - a
        - b
      - - c
        - d
      - - e
        - a
      Store:
      - - e
        - c
    rules:
    - PointsTo(y, x) :- Assign(y, z), PointsTo(z, x).
    - PointsTo(y, w) :- Load(y, x), PointsTo(x, z), PointsTo(z, w).
    - PointsTo(z, w) :- Store(y, x), PointsTo(y, z), PointsTo(x, w).
  expect:
    PointsTo:
    - - a
      - b
    - - c
      - d
    - - e
      - a
    - - f
      - b
    - - a
      - d
    - - f
      - d
