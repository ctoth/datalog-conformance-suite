source: souffle/example/paths
tags:
- example
- souffle
tests:
- name: souffle_paths_path
  description: Harvested from Souffle testcase paths, asserting exported relation
    path.
  tags:
  - example
  - recursion
  - souffle
  program:
    facts: &id001
      edge:
      - - a
        - c
      - - b
        - a
      - - b
        - d
    rules: &id002
    - path(X,Y) :- path(X,Z), edge(Z,Y).
    - path(X,Y) :- edge(X,Y).
  expect:
    path:
    - - a
      - b
    - - a
      - c
    - - b
      - a
    - - b
      - d
    - - a
      - a
    - - a
      - d
    - - b
      - b
    - - b
      - c
- name: souffle_paths_edge
  description: Harvested from Souffle testcase paths, asserting exported relation
    edge.
  tags:
  - basic
  - example
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    edge:
    - - a
      - b
    - - a
      - c
    - - b
      - a
    - - b
      - d
