source: souffle/example/weighted_distances
tags:
- example
- souffle
tests:
- name: souffle_weighted_distances_Reachable
  description: Harvested from Souffle testcase weighted_distances, asserting exported
    relation Reachable.
  tags:
  - example
  - recursion
  - souffle
  program:
    facts: &id001
      Edge:
      - - 1
        - 2
        - 5
      - - 2
        - 3
        - 1
      - - 1
        - 4
        - -6
      - - 4
        - 2
        - -1
    rules: &id002
    - Reachable(x,y,d+w) :- Edge(x,z,w), Reachable(z,y,d).
  expect:
    Reachable:
    - - 0
      - 1
      - 3
    - - 1
      - 2
      - 5
    - - 2
      - 3
      - 1
    - - 1
      - 4
      - -6
    - - 4
      - 2
      - -1
    - - 0
      - 2
      - 8
    - - 0
      - 4
      - -3
    - - 1
      - 3
      - 6
    - - 1
      - 2
      - -7
    - - 4
      - 3
      - 0
    - - 0
      - 2
      - -4
    - - 0
      - 3
      - 9
    - - 1
      - 3
      - -6
    - - 0
      - 3
      - -3
- name: souffle_weighted_distances_ShortestDuplicates
  description: Harvested from Souffle testcase weighted_distances, asserting exported
    relation ShortestDuplicates.
  tags:
  - basic
  - example
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    ShortestDuplicates:
    - - 1
      - 2
      - -7
    - - 0
      - 2
      - -4
    - - 1
      - 3
      - -6
    - - 0
      - 3
      - -3
