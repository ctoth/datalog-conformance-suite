- name: souffle_small_mother
  description: Harvested from Souffle testcase small, asserting exported relation
    mother.
  tags:
  - basic
  - example
  - souffle
  program:
    facts: &id001
      mother:
      - - claudette
        - ann
      - - jeannette
        - bill
      - - mireille
        - john
      father:
      - - john
        - ann
      - - john
        - bill
      - - jean-jacques
        - alphonse
      - - alphonse
        - mireille
      - - brad
        - john
    rules: &id002
    - parent(X,Y) :- father(X,Y).
    - ancestor(X,Y) :- parent(X,Y).
    - ancestor(X,Y) :- parent(X,Z), ancestor(Z,Y).
  expect:
    mother:
    - - claudette
      - ann
    - - jeannette
      - bill
    - - mireille
      - john
