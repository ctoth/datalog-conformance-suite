source: souffle/example/cba_expr_value
tags:
- example
- souffle
tests:
- name: souffle_cba_expr_value_data_term
  description: Harvested from Souffle testcase cba_expr_value, asserting exported
    relation data_term.
  tags:
  - example
  - recursion
  - souffle
  program:
    facts:
      kind:
      - - Var
      - - Abs
      - - App
      lits:
      - - 1
        - 2
      term:
      - - 0
        - Lit
        - 0
      - - 1
        - Lit
        - 1
      - - 2
        - Var
        - 0
      - - 3
        - Var
        - 1
      - - 4
        - Var
        - 2
      - - 5
        - Abs
        - 0
      - - 6
        - Abs
        - 1
      - - 7
        - Abs
        - 2
      - - 8
        - App
        - 0
      - - 9
        - App
        - 1
      - - 10
        - App
        - 2
      vars:
      - - 1
        - y
      - - 2
        - z
      abs:
      - - 1
        - 1
        - 7
      - - 2
        - 2
        - 4
      app:
      - - 1
        - 2
        - 0
      - - 2
        - 5
        - 6
    rules:
    - data_term( i, v ) :- term(i,"Var",x), data_var( x, v ).
    - data_term( i, v ) :- term(i,"App",x), app(x,t1,_), ctrl_term(t1, f), abs( f,
      _, b), data_term( b, v ).
    - data_var( i, v ) :- app( _, a, b ), ctrl_term( a, f ), abs( f, i, _), data_term(
      b, v).
    - ctrl_term( i, v ) :- term(i,"Var",x), ctrl_var( x, v ).
    - ctrl_term( i, v ) :- term(i,"App",x), app(x,t1,_), ctrl_term(t1, f), abs( f,
      _, b), ctrl_term( b, v ).
    - ctrl_term( i, v ) :- term( i, "Abs", v ).
    - ctrl_var( i, v ) :- app( _, a, b ), ctrl_term( a, f ), abs( f, i, _), ctrl_term(
      b, v).
  expect:
    data_term:
    - - 0
      - 3
    - - 1
      - 2
    - - 3
      - 3
    - - 4
      - 2
    - - 8
      - 2
    - - 10
      - 2
