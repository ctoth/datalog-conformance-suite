source: souffle/evaluation/grammar
tags:
- evaluation
- souffle
tests:
- name: souffle_grammar_t
  description: Harvested from Souffle testcase grammar, asserting exported relation
    t.
  tags:
  - basic
  - evaluation
  - souffle
  program:
    facts: &id001
      t:
      - - 2
        - b
        - 3
      - - 3
        - a
        - 4
      - - 4
        - b
        - 5
      - - 5
        - a
        - 6
    rules: &id002
    - a(F,L) :- t(F,"a",L).
    - a(F,L) :- a(F,M), t(M,"b",L).
    - a(F,L) :- a(F,M), t(M,"a",L).
  expect:
    t:
    - - 1
      - a
      - 2
    - - 2
      - b
      - 3
    - - 3
      - a
      - 4
    - - 4
      - b
      - 5
    - - 5
      - a
      - 6
- name: souffle_grammar_a
  description: Harvested from Souffle testcase grammar, asserting exported relation
    a.
  tags:
  - evaluation
  - recursion
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    a:
    - - 1
      - 2
    - - 3
      - 4
    - - 5
      - 6
    - - 1
      - 3
    - - 3
      - 5
    - - 1
      - 4
    - - 3
      - 6
    - - 1
      - 5
    - - 1
      - 6
