- name: souffle_rmut_X
  description: Harvested from Souffle testcase rmut, asserting exported relation X.
  tags:
  - basic
  - evaluation
  - souffle
  program:
    facts: &id001
      X:
      - - b
      - - c
    rules: &id002
    - A(x) :- X(x).
    - B(x) :- X(x), A(x).
    - C(x) :- X(x), A(x), B(x).
    - D(x) :- X(x), A(x), B(x), C(x).
    - A(x) :- X(x), A(x), B(x), C(x), D(x).
    - B(x) :- X(x), A(x), B(x), C(x), D(x).
    - C(x) :- X(x), A(x), B(x), C(x), D(x).
    - D(x) :- X(x), A(x), B(x), C(x), D(x).
  expect:
    X:
    - - a
    - - b
    - - c
