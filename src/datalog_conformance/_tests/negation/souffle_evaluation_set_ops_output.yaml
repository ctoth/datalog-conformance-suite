source: souffle/evaluation/set_ops_output
tags:
- evaluation
- souffle
tests:
- name: souffle_set_ops_output_AintersectionB
  description: Harvested from Souffle testcase set_ops_output, asserting exported
    relation AintersectionB.
  tags:
  - evaluation
  - negation
  - souffle
  program:
    facts: &id001
      A:
      - - 2
      - - 3
      - - 4
      B:
      - - 2
      - - 3
      - - 4
      - - 5
    rules: &id002
    - AintersectionB(X) :- A(X), B(X).
    - AunionB(X) :- A(X).
    - AunionB(X) :- B(X).
    - AminusB(X) :- A(X), not B(X).
    - BminusA(X) :- B(X), not A(X).
    - AxB(X, Y) :- A(X), B(Y).
  expect:
    AintersectionB:
    - - 2
    - - 3
    - - 4
- name: souffle_set_ops_output_AunionB
  description: Harvested from Souffle testcase set_ops_output, asserting exported
    relation AunionB.
  tags:
  - evaluation
  - negation
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    AunionB:
    - - 1
    - - 2
    - - 3
    - - 4
    - - 5
- name: souffle_set_ops_output_AminusB
  description: Harvested from Souffle testcase set_ops_output, asserting exported
    relation AminusB.
  tags:
  - evaluation
  - negation
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    AminusB:
    - - 1
- name: souffle_set_ops_output_BminusA
  description: Harvested from Souffle testcase set_ops_output, asserting exported
    relation BminusA.
  tags:
  - evaluation
  - negation
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    BminusA:
    - - 5
- name: souffle_set_ops_output_AxB
  description: Harvested from Souffle testcase set_ops_output, asserting exported
    relation AxB.
  tags:
  - evaluation
  - negation
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    AxB:
    - - 1
      - 2
    - - 1
      - 3
    - - 1
      - 4
    - - 1
      - 5
    - - 2
      - 2
    - - 2
      - 3
    - - 2
      - 4
    - - 2
      - 5
    - - 3
      - 2
    - - 3
      - 3
    - - 3
      - 4
    - - 3
      - 5
    - - 4
      - 2
    - - 4
      - 3
    - - 4
      - 4
    - - 4
      - 5
