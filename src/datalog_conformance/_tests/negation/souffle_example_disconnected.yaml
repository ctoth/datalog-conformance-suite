tests:
- name: souffle_disconnected_DisConnected
  description: Harvested from Souffle testcase disconnected, asserting exported relation
    DisConnected.
  tags:
  - example
  - negation
  - souffle
  program:
    facts:
      Edge:
      - - a
        - b
        - 1
      - - a
        - e
        - 5
      - - b
        - c
        - 2
      - - b
        - e
        - 4
      - - c
