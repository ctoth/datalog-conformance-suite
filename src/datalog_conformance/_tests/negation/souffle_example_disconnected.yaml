        - 3
      - - c
        - e
        - 40
      - - f
        - g
        - 1
      - - g
        - h
        - 1
      - - h
        - f
        - 1
    rules:
    - Connected(n, n) :- Edge(_, n, _).
    - Connected(n, m) :- Edge(n, m, _).
    - Connected(n, m) :- Edge(n, z, _), Connected(z, m).
    - DisConnected(n, m) :- Edge(n, _, _), Edge(m, _, _), not Connected(n, m).
  expect:
    DisConnected:
