source: souffle/example/flights
tags:
- example
- souffle
tests:
- name: souffle_flights_VAflies
  description: Harvested from Souffle testcase flights, asserting exported relation
    VAflies.
  tags:
  - example
  - recursion
  - souffle
  program:
    facts:
      flight:
      - - QA
        - AU
        - CHI
      - - QA
        - AU
        - JPN
      - - QA
        - JPN
        - DEN
      - - QA
        - JPN
        - CHI
      - - QA
        - AU
        - CHI
      - - VA
        - AU
        - CHI
      - - VA
        - JPN
        - ZA
      - - VA
        - JPN
        - DEN
      - - VA
        - DEN
        - ZA
    rules:
    - QAflies(X,Y) :- flight("QA",X,Z), QAflies(Z,Y).
    - VAflies(X,Y) :- flight("VA",X,Y).
    - VAflies(X,Y) :- flight("VA",X,Z), VAflies(Z,Y).
    - QAonly(X,Y) :- QAflies(X,Y), not VAflies(X,Y).
  expect:
    VAflies:
    - - AU
      - CHI
    - - JPN
      - ZA
    - - JPN
      - DEN
    - - DEN
      - ZA
verification:
  implementation: nmo
  kind: direct
