source: souffle/example/flights
tags:
- example
- souffle
tests:
- name: souffle_flights_QAflies
  description: Harvested from Souffle testcase flights, asserting exported relation
    QAflies.
  tags:
  - example
  - recursion
  - souffle
  program:
    facts: &id001
      flight:
      - - QA
        - AU
        - CHI
      - - QA
        - AU
        - JPN
      - - QA
        - JPN
        - DEN
      - - QA
        - JPN
        - CHI
      - - QA
        - AU
        - CHI
      - - VA
        - AU
        - CHI
      - - VA
        - JPN
        - ZA
      - - VA
        - JPN
        - DEN
      - - VA
        - DEN
        - ZA
    rules: &id002
    - QAflies(X,Y) :- flight("QA",X,Z), QAflies(Z,Y).
    - VAflies(X,Y) :- flight("VA",X,Y).
    - VAflies(X,Y) :- flight("VA",X,Z), VAflies(Z,Y).
    - QAonly(X,Y) :- QAflies(X,Y), not VAflies(X,Y).
  expect:
    QAflies:
    - - AU
      - CHI
    - - AU
      - JPN
    - - JPN
      - DEN
    - - JPN
      - CHI
    - - AU
      - DEN
- name: souffle_flights_VAflies
  description: Harvested from Souffle testcase flights, asserting exported relation
    VAflies.
  tags:
  - example
  - recursion
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    VAflies:
    - - AU
      - CHI
    - - JPN
      - ZA
    - - JPN
      - DEN
    - - DEN
      - ZA
- name: souffle_flights_QAonly
  description: Harvested from Souffle testcase flights, asserting exported relation
    QAonly.
  tags:
  - example
  - negation
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    QAonly:
    - - AU
      - JPN
    - - JPN
      - CHI
    - - AU
      - DEN
