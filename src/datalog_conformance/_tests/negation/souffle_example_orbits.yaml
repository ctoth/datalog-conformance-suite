source: souffle/example/orbits
tags:
- example
- souffle
tests:
- name: souffle_orbits_star
  description: Harvested from Souffle testcase orbits, asserting exported relation
    star.
  tags:
  - example
  - negation
  - souffle
  program:
    facts: &id001
      orbits:
      - - earth
        - sun
      - - moon
        - earth
    rules: &id002
    - orbits(X,Y) :- orbits(X,Z), orbits(Z,Y).
    - satellite(X,Y) :- orbits(X,Y), not intermediate(X,Y), not star(Y).
    - planet(X) :- orbits(X,Y), star(Y), not intermediate(X,Y).
    - intermediate(X,Y) :- orbits(X,Z), orbits(Z,Y).
  expect:
    star:
    - - sun
- name: souffle_orbits_orbits
  description: Harvested from Souffle testcase orbits, asserting exported relation
    orbits.
  tags:
  - example
  - recursion
  - souffle
  program:
    facts: *id001
    rules: *id002
  expect:
    orbits:
    - - earth
      - sun
    - - moon
      - earth
    - - moon
      - sun
- name: souffle_orbits_planet
  description: Harvested from Souffle testcase orbits, asserting exported relation
