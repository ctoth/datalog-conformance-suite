source: souffle/example/tic-tac-toe
tags:
- example
- souffle
tests:
- name: souffle_tic-tac-toe_decided_games
  description: Harvested from Souffle testcase tic-tac-toe, asserting exported relation
    decided_games.
  tags:
  - example
  - negation
  - souffle
  program:
    facts:
      player:
      - - O
      cell:
      - - X
      - - O
      other:
      - - O
        - X
      reachable_state:
      - - 0
    rules:
    - reachable_state( a1,b1,c1,a2,b2,c2,a3,b3,c3, p ) :- state_succ( _,_,_, _,_,_,
      _,_,_, _, a1,b1,c1, a2,b2,c2, a3,b3,c3, p ).
    - row2( a1,b1,c1,a2,b2,c2,a3,b3,c3, a2,b2,c2 ) :- all_states(a1,b1,c1,a2,b2,c2,a3,b3,c3,_).
    - row3( a1,b1,c1,a2,b2,c2,a3,b3,c3, a3,b3,c3 ) :- all_states(a1,b1,c1,a2,b2,c2,a3,b3,c3,_).
    - col1( a1,b1,c1,a2,b2,c2,a3,b3,c3, a1,a2,a3 ) :- all_states(a1,b1,c1,a2,b2,c2,a3,b3,c3,_).
    - col2( a1,b1,c1,a2,b2,c2,a3,b3,c3, b1,b2,b3 ) :- all_states(a1,b1,c1,a2,b2,c2,a3,b3,c3,_).
    - col3( a1,b1,c1,a2,b2,c2,a3,b3,c3, c1,c2,c3 ) :- all_states(a1,b1,c1,a2,b2,c2,a3,b3,c3,_).
    - dig1( a1,b1,c1,a2,b2,c2,a3,b3,c3, a1,b2,c3 ) :- all_states(a1,b1,c1,a2,b2,c2,a3,b3,c3,_).
    - dig2( a1,b1,c1,a2,b2,c2,a3,b3,c3, c1,b2,a3 ) :- all_states(a1,b1,c1,a2,b2,c2,a3,b3,c3,_).
    - has_won( a1,b1,c1,a2,b2,c2,a3,b3,c3, x ) :- row2( a1,b1,c1,a2,b2,c2,a3,b3,c3,
      x,x,x ).
    - has_won( a1,b1,c1,a2,b2,c2,a3,b3,c3, x ) :- row3( a1,b1,c1,a2,b2,c2,a3,b3,c3,
      x,x,x ).
    - has_won( a1,b1,c1,a2,b2,c2,a3,b3,c3, x ) :- col1( a1,b1,c1,a2,b2,c2,a3,b3,c3,
      x,x,x ).
    - has_won( a1,b1,c1,a2,b2,c2,a3,b3,c3, x ) :- col2( a1,b1,c1,a2,b2,c2,a3,b3,c3,
      x,x,x ).
    - has_won( a1,b1,c1,a2,b2,c2,a3,b3,c3, x ) :- col3( a1,b1,c1,a2,b2,c2,a3,b3,c3,
      x,x,x ).
    - has_won( a1,b1,c1,a2,b2,c2,a3,b3,c3, x ) :- dig1( a1,b1,c1,a2,b2,c2,a3,b3,c3,
      x,x,x ).
    - has_won( a1,b1,c1,a2,b2,c2,a3,b3,c3, x ) :- dig2( a1,b1,c1,a2,b2,c2,a3,b3,c3,
      x,x,x ).
    - won( a1,b1,c1,a2,b2,c2,a3,b3,c3 ) :- has_won(a1,b1,c1,a2,b2,c2,a3,b3,c3,"O").
    - finished( a1,b1,c1,a2,b2,c2,a3,b3,c3 ) :- draw(a1,b1,c1,a2,b2,c2,a3,b3,c3).
    - valid_move( aa1," ",ac1,aa2,ab2,ac2,aa3,ab3,ac3, a, aa1, a ,ac1,aa2,ab2,ac2,aa3,ab3,ac3
      ) :- reachable_state(aa1," ",ac1,aa2,ab2,ac2,aa3,ab3,ac3, a).
    - valid_move( aa1,ab1," ",aa2,ab2,ac2,aa3,ab3,ac3, a, aa1,ab1, a ,aa2,ab2,ac2,aa3,ab3,ac3
      ) :- reachable_state(aa1,ab1," ",aa2,ab2,ac2,aa3,ab3,ac3, a).
    - valid_move( aa1,ab1,ac1," ",ab2,ac2,aa3,ab3,ac3, a, aa1,ab1,ac1, a ,ab2,ac2,aa3,ab3,ac3
      ) :- reachable_state(aa1,ab1,ac1," ",ab2,ac2,aa3,ab3,ac3, a).
    - valid_move( aa1,ab1,ac1,aa2," ",ac2,aa3,ab3,ac3, a, aa1,ab1,ac1,aa2, a ,ac2,aa3,ab3,ac3
      ) :- reachable_state(aa1,ab1,ac1,aa2," ",ac2,aa3,ab3,ac3, a).
    - valid_move( aa1,ab1,ac1,aa2,ab2," ",aa3,ab3,ac3, a, aa1,ab1,ac1,aa2,ab2, a ,aa3,ab3,ac3
      ) :- reachable_state(aa1,ab1,ac1,aa2,ab2," ",aa3,ab3,ac3, a).
    - valid_move( aa1,ab1,ac1,aa2,ab2,ac2," ",ab3,ac3, a, aa1,ab1,ac1,aa2,ab2,ac2,
      a ,ab3,ac3 ) :- reachable_state(aa1,ab1,ac1,aa2,ab2,ac2," ",ab3,ac3, a).
    - valid_move( aa1,ab1,ac1,aa2,ab2,ac2,aa3," ",ac3, a, aa1,ab1,ac1,aa2,ab2,ac2,aa3,
      a ,ac3 ) :- reachable_state(aa1,ab1,ac1,aa2,ab2,ac2,aa3," ",ac3, a).
    - valid_move( aa1,ab1,ac1,aa2,ab2,ac2,aa3,ab3," ", a, aa1,ab1,ac1,aa2,ab2,ac2,aa3,ab3,
      a ) :- reachable_state(aa1,ab1,ac1,aa2,ab2,ac2,aa3,ab3," ", a).
    - state_succ( aa1,ab1,ac1,aa2,ab2,ac2,aa3,ab3,ac3, a, ba1,bb1,bc1,ba2,bb2,bc2,ba3,bb3,bc3,
      b ) :- reachable_state( aa1,ab1,ac1,aa2,ab2,ac2,aa3,ab3,ac3, a ), other(a,b),
      not finished( aa1,ab1,ac1,aa2,ab2,ac2,aa3,ab3,ac3 ), valid_move( aa1,ab1,ac1,aa2,ab2,ac2,aa3,ab3,ac3,
      a, ba1,bb1,bc1,ba2,bb2,bc2,ba3,bb3,bc3 ).
    - possible_results( a1,b1,c1,a2,b2,c2,a3,b3,c3, p, "O") :- reachable_state(a1,b1,c1,a2,b2,c2,a3,b3,c3,
      p), has_won( a1,b1,c1,a2,b2,c2,a3,b3,c3, "O" ).
    - possible_results( aa1,ab1,ac1,aa2,ab2,ac2,aa3,ab3,ac3, ap, x) :- state_succ(
      aa1,ab1,ac1,aa2,ab2,ac2,aa3,ab3,ac3, ap, ba1,bb1,bc1,ba2,bb2,bc2,ba3,bb3,bc3,
      bp ), possible_results( ba1,bb1,bc1,ba2,bb2,bc2,ba3,bb3,bc3, bp, x).
    - decided_games( a1,b1,c1,a2,b2,c2,a3,b3,c3, "X", "O" ) :- not won(a1,b1,c1,a2,b2,c2,a3,b3,c3),
      possible_results( a1,b1,c1,a2,b2,c2,a3,b3,c3, "X", "O" ), not possible_results(
      a1,b1,c1,a2,b2,c2,a3,b3,c3, "X", "X" ).
